[project]
name = "gridpulse-backend"
version = "0.1.0"
description = "GridPulse — multi-agent urban emergency-response simulation (hackathon prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "networkx>=3.3",
    "httpx>=0.27",
    "anthropic>=2.0",
    "argon2-cffi>=25.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = ""

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
